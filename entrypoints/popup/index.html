<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statsig Browser Extension</title>
    <meta name="manifest.type" content="browser_action" />
    <script>
      try {
        chrome.storage.local.get('local:theme', (item) => {
          const theme = item['local:theme'] || 'system'
          const root = document.documentElement
          if (theme === 'system') {
            const systemTheme = globalThis.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            root.classList.add(systemTheme)
          } else {
            root.classList.add(theme)
          }
        })
      } catch {
        // Theme is applied later by React if storage is unavailable.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
