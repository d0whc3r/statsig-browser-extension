name: 'Build the extension'
on:
  pull_request:
    types: [opened, reopened, synchronize]

  workflow_dispatch:

env:
  NODE_OPTIONS: '--max-old-space-size=4096 --trace-warnings'

# Superseded pushes to the same PR are pointless work and compete for runners.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm vitest run --reporter=dot --silent --coverage.reporter=lcovonly

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build the extension
        run: pnpm run zip:chrome

      - name: Archive the extension production build as ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-prod-build
          path: .output/*-chrome.zip
          retention-days: 30

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Install Playwright browsers
        uses: ./.github/actions/install-playwright

      - name: Build extension for e2e
        run: pnpm build:chrome

      - name: Run e2e tests
        run: pnpm exec xvfb-run --auto-servernum -- playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
