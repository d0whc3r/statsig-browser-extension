name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # for semantic-release to push tags and releases
  issues: write # for semantic-release to comment on issues
  pull-requests: write # for semantic-release to comment on PRs

# Queue releases instead of cancelling: killing semantic-release mid-publish
# can leave a tag pushed without its GitHub release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm vitest run --reporter=dot --silent --coverage.reporter=lcovonly

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Install Playwright browsers
        uses: ./.github/actions/install-playwright

      - name: Build extension for e2e
        run: pnpm build:chrome

      - name: Run e2e tests
        run: pnpm exec xvfb-run --auto-servernum -- playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  release:
    name: Release
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for semantic-release to analyze commits
          persist-credentials: false # Required for semantic-release/git

      - name: Setup project
        uses: ./.github/actions/setup-project

      # semantic-release builds the zips itself via the @semantic-release/exec prepareCmd.
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
