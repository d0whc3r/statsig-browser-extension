version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    exclude-paths:
      - '.agents/**'
    ignore:
      - dependency-name: '@types/node'
    groups:
      dependencies:
        patterns:
          - '*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    exclude-paths:
      - '.agents/**'
